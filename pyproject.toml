[project]
name = "aad-greeks"
version = "0.1.0"
description = "Adjoint automatic differentiation for option Greeks, checked against analytic and bumped baselines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
